{% extends 'base.html' %}
{% block content %}
<h1>Цены</h1>
<form class="card grid" method="post">
  <select name="country_id">{% for x in countries %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select>
  <select name="city_id">{% for x in cities %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select>
  <select name="court_id">{% for x in courts %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select>
  <select name="time_slot_id">{% for x in slots %}<option value="{{x.id}}">{{x.label}}</option>{% endfor %}</select>
  <input name="amount" type="number" step="0.01" placeholder="Сумма" required>
  <input name="event_type" placeholder="regular">
  <button>Сохранить</button>
</form>
<table class="card table">
  <tr><th>Локация</th><th>Слот</th><th>Тип</th><th>Сумма</th></tr>
  {% for p in prices %}
  <tr><td>{{ p.country.name }} / {{ p.city.name }} / {{ p.court.name }}</td><td>{{ p.time_slot.label }}</td><td>{{ p.event_type }}</td><td>{{ p.amount }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
