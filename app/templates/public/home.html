{% extends 'base.html' %}
{% block content %}
<h1>Запись на падел</h1>
<form method="post" action="{{ url_for('calculate_price') }}" class="card grid">
  <label>Страна
    <select name="country_id" required>
      {% for c in countries %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Город
    <select name="city_id" required>
      {% for c in cities %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Корт
    <select name="court_id" required>
      <option value="">Выберите корт</option>
      {% for c in courts %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Дата
    <input type="date" name="play_date" required>
  </label>
  <label>Время
    <select name="time_slot_id" required>
      <option value="">Выберите слот</option>
      {% for s in slots %}<option value="{{ s.id }}">{{ s.label }}</option>{% endfor %}
    </select>
  </label>
  <button>Показать стоимость</button>
</form>
{% endblock %}
